[project]
name = "sitsolar-ha"
version = "1.1.0"
description = "Home Assistant custom integration for Sit Solar / Futura Sun hybrid inverters via the Si-Dongle-L WiFi dongle"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
    "B",    # bugbear
    "C4",   # comprehensions
    "DTZ",  # datetimez
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FLY",  # flynt
    "G",    # logging format
    "I",    # isort
    "INT",  # import format
    "ISC",  # implicit string concat
    "PIE",  # misc
    "PT",   # pytest style
    "PTH",  # pathlib
    "RUF",  # ruff specific
    "SIM",  # simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "YTT",  # flake8-2020
]
ignore = [
    "SIM108",  # ternary is not always clearer
    "RUF012",  # mutable class attrs: HA uses ClassVar everywhere, noisy here
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "PT011", "PT012"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "sitsolar_dongle"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
